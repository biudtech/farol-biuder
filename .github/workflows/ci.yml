name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# O gate só lê o código. Nenhum job aqui escreve no repositório.
permissions:
  contents: read

# Push novo na mesma branch cancela a rodada anterior. Na main não cancela,
# porque a rodada da main é o registro de que aquele commit passou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # Teto de tempo: a suite roda em segundos, entao 15 minutos e folga larga.
    # Ele existe porque sem teto o default do GitHub e de SEIS HORAS, e em
    # 30/08/2026 um job ficou preso no passo de testes duas vezes no mesmo dia,
    # segurando PR em BLOCKED enquanto queimava runner. Job eterno nao informa
    # nada; job vermelho informa.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      # Sem npm install de propósito: o parser é um artefato distribuído e a
      # suíte usa o runner nativo `node --test`, que não toca em
      # node_modules.
      - name: Sintaxe
        run: npm run check

      - name: Gate de qualidade e higiene
        run: npm run lint

      # O npm test varre o repositório inteiro, inclusive
      # test/jira-mcp-processo.test.js (o servidor MCP do Jira em processo).
      - name: Testes
        run: npm test

  # O gate do front (web/): pacote próprio, com dependências próprias. O motor continua sem
  # npm install; aqui o `npm ci` instala só o que o package-lock de web/ fixa.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependências
        run: npm ci

      # Inclui as de desenvolvimento: nada sobe com vulnerabilidade conhecida. A única saída é
      # exceção com motivo e prazo em auditoria-excecoes.json (advisory sem versão corrigida, fora do build).
      - name: Auditoria
        run: npm run audit

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O endereço do motor é lido no build. Este é o de desenvolvimento, só para o build
      # do CI ter um valor: nada é publicado daqui.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FAROL_API: http://127.0.0.1:47170

      # O servidor do socket Unix (servidor.mjs) sobre o build acima: CSP por nonce, permissão
      # 600, socket órfão, socket vivo e o encerramento. O endereço é o mesmo do build.
      - name: Servidor no socket
        run: npm run test:servidor
        env:
          NEXT_PUBLIC_FAROL_API: http://127.0.0.1:47170

  # A imagem do container do motor (Dockerfile, docs/HOSPEDAGEM.md): constrói e prova com o
  # container de pé. NÃO publica: não há login em registro, não há push e não há segredo. O
  # job de publicação fica para quando o registro for decidido (o esboço está no guia).
  # Sem cache de build de propósito: o build leva cerca de um minuto, e o cache do Actions
  # pediria duas ações de terceiros e reaproveitaria entre branches a camada que confere o
  # chaveiro do gh e traz as correções de segurança do Debian.
  imagem:
    name: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Construir a imagem (sem push)
        run: |
          docker build \
            --build-arg FAROL_VERSAO="$(jq -r .version package.json)" \
            --build-arg FAROL_REVISAO="${{ github.sha }}" \
            --build-arg FAROL_CRIADA_EM="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag farol-biuder-motor:ci .
          docker image inspect --format 'tamanho: {{.Size}} bytes, usuario: {{.Config.User}}' farol-biuder-motor:ci

      # Saúde, 404 da raiz, 401 sem token, a sonda, a parada com código 0 e as três recusas
      # da instância hospedada, com a raiz do container somente leitura; o pnpm na versão do
      # Dockerfile e a instalação da ferramenta técnica sem acesso à origem (sem rede e sem
      # login do gh), que falha com a mensagem da causa e não deixa pasta em toolchains. O
      # runner não tem acesso ao repositório privado da ferramenta: nada é clonado.
      - name: Provar a imagem com o container de pé
        run: bash tools/provar-imagem.sh farol-biuder-motor:ci

  # O pacote do front para a hospedagem compartilhada (docs/HOSPEDAGEM.md, "A main no ar
  # sozinha"): lá o build do Next não cabe no limite de threads, então ele sai daqui, já com o
  # endereço público do motor, e o docs/exemplos/autoatualizar.sh do servidor o baixa. Só na
  # main, só com os três gates verdes e só com a variável do repositório FAROL_API_PUBLICA
  # definida. O artefato leva o .next sem o cache e o commit em .next/REVISAO_FAROL, que o
  # servidor confere antes de trocar. Não escreve no repositório e não usa segredo.
  pacote-do-front:
    name: pacote-do-front
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, web, imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FAROL_API_PUBLICA != ''
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependências
        run: npm ci

      - name: Build com o endereço público do motor
        run: npm run build
        env:
          NEXT_PUBLIC_FAROL_API: ${{ vars.FAROL_API_PUBLICA }}

      - name: Empacotar o .next com o commit
        run: |
          echo "${{ github.sha }}" > .next/REVISAO_FAROL
          tar -czf ../front.tgz --exclude=.next/cache .next

      - uses: actions/upload-artifact@v7
        with:
          name: front-${{ github.sha }}
          path: front.tgz
          retention-days: 14
          if-no-files-found: error

  # Job agregador: é ESTE nome que a proteção da branch exige. Assim dá pra
  # mexer nos jobs de cima sem reconfigurar a regra. Ele exige o gate do motor,
  # o do front e a imagem do container.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, web, imagem]
    if: always()
    steps:
      - name: Conferir resultado do gate, do front e da imagem
        run: |
          falhou=0
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "gate falhou: ${{ needs.gate.result }}"
            falhou=1
          fi
          if [ "${{ needs.web.result }}" != "success" ]; then
            echo "web falhou: ${{ needs.web.result }}"
            falhou=1
          fi
          if [ "${{ needs.imagem.result }}" != "success" ]; then
            echo "imagem falhou: ${{ needs.imagem.result }}"
            falhou=1
          fi
          if [ "$falhou" != "0" ]; then exit 1; fi
          echo "gate, web e imagem verdes"
