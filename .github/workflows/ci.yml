name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# O gate só lê o código. Nenhum job aqui escreve no repositório.
permissions:
  contents: read

# Push novo na mesma branch cancela a rodada anterior. Na main não cancela,
# porque a rodada da main é o registro de que aquele commit passou.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # Teto de tempo: a suite roda em segundos, entao 15 minutos e folga larga.
    # Ele existe porque sem teto o default do GitHub e de SEIS HORAS, e em
    # 30/08/2026 um job ficou preso no passo de testes duas vezes no mesmo dia,
    # segurando PR em BLOCKED enquanto queimava runner. Job eterno nao informa
    # nada; job vermelho informa.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      # Sem npm install de propósito: o parser é um artefato distribuído e a
      # suíte usa o runner nativo `node --test`, que não toca em
      # node_modules.
      - name: Sintaxe
        run: npm run check

      - name: Gate de qualidade e higiene
        run: npm run lint

      # O npm test varre o repositório inteiro, inclusive
      # test/jira-mcp-processo.test.js (o servidor MCP do Jira em processo).
      - name: Testes
        run: npm test

  # Job agregador: é ESTE nome que a proteção da branch exige. Assim dá pra
  # mexer nos jobs de cima sem reconfigurar a regra.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate]
    if: always()
    steps:
      - name: Conferir resultado do gate
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "gate falhou: ${{ needs.gate.result }}"
            exit 1
          fi
          echo "gate verde"
