name: Bug
description: Algo do Farol não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Falha de segurança **não** vem por aqui, siga o [SECURITY.md](https://github.com/biudtech/farol-biuder/blob/main/.github/SECURITY.md).

  - type: input
    id: commit
    attributes:
      label: Commit do motor
      description: A saída de `git rev-parse --short HEAD` no clone que roda o `node server.js`.
      placeholder: "c16cb47c"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Onde acontece
      options:
        - Radar (fila de PRs)
        - Revisão automática (headless)
        - Postagem no GitHub (aprovar, pedir mudanças, comentar)
        - Time (memória por autor)
        - Consumo
        - Sistema (diagnóstico, conta, configurações)
        - Outro
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true

  - type: textarea
    id: aconteceu
    attributes:
      label: O que aconteceu
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para reproduzir
      placeholder: |
        1. Subir o motor com `node server.js`
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Trecho do log de falhas
      description: Sistema > log de falhas, ou o arquivo `~/.farol/state/farol.log`. Cole só as linhas do episódio.
      render: text
    validations:
      required: false

  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico do ambiente
      description: O resultado do Diagnóstico em Sistema, se ele acusar algo.
    validations:
      required: false

  - type: checkboxes
    id: higiene
    attributes:
      label: Confirmação
      options:
        - label: Conferi que não colei token, credencial nem conteúdo de repositório privado.
          required: true
