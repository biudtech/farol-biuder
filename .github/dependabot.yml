version: 2
updates:
  # O motor não tem dependência de runtime (invariante 1); a única de desenvolvimento é o
  # @babel/parser. O artefato que o motor usa é o de assets/third-party/babel-parser, e um bump
  # daqui não o troca. Cadência mensal.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
